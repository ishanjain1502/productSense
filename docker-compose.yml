# ProductSense — default: one container (Next + API).
#
#   cp server/.env.example server/.env
#   docker compose up --build
#   open http://localhost:3000
#
# Split stack (two containers, local dev):
#   docker compose --profile split up --build
#
# Demo seed (monolith):
#   docker compose --profile seed run --rm seed

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:${CLIENT_PORT:-3000}"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${CLIENT_PORT:-3000}
      API_INTERNAL_PORT: 1337
      DATABASE_PATH: ./data/app.db
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    volumes:
      - productsense-data:/app/server/data
    restart: unless-stopped

  seed:
    profiles: [seed]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_PATH: ./data/app.db
    volumes:
      - productsense-data:/app/server/data
    entrypoint: ["sh", "-c", "cd /app/server && npm run seed:demo"]

  server:
    profiles: [split]
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-1337}:1337"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 1337
      DATABASE_PATH: ./data/app.db
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:1337}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-docker}
    volumes:
      - productsense-split-server-data:/app/data
    restart: unless-stopped

  client:
    profiles: [split]
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:1337}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  productsense-data:
  productsense-split-server-data:

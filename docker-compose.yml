# ProductSense — run the full stack with Docker.
#
# Prerequisites:
#   cp server/.env.example server/.env   # add API keys as needed
#
# Usage:
#   docker compose up --build
#   open http://localhost:3000  (API: http://localhost:1337)
#
# Optional demo seed (after stack is healthy):
#   docker compose --profile seed run --rm seed

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${SERVER_PORT:-1337}:1337"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 1337
      DATABASE_PATH: ./data/app.db
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:1337}
      JWT_SECRET: ${JWT_SECRET:-change-me-for-docker}
    volumes:
      - productsense-server-data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:1337}
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  seed:
    profiles: [seed]
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_PATH: ./data/app.db
    volumes:
      - productsense-server-data:/app/data
    entrypoint: ["npm", "run", "seed:demo"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  productsense-server-data:
